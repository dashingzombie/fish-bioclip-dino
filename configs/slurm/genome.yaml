defaults: [../train/projection_only.yaml]
slurm:
  job_name: fish-dino-bioclip
  gpus: 4
  cpus: 128
  memory: 700G
  time_limit: "4:00:00"
  partition: gpu-h200
  account: worm-species
  environment_activate: source .venv/bin/activate
  work_dir: .
  log_dir: outputs/slurm
  script_dir: outputs/slurm
  stage_cache_on_node: true
  node_cache_dir: fish-vlm-cache
