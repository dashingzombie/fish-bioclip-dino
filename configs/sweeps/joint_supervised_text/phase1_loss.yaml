defaults: [../../train/joint_supervised_text.yaml]

sweep:
  name: joint-supervised-text
  phase: loss
  strategy: reduced_pairwise
  target_runs: 30
  parent_phase: null
  fixed:
    seed: 42
    training.max_steps: 10000
    training.validation_interval_steps: 250
    training.early_stopping_patience_evaluations: 6
    validation.selection_metric: estimated_overall_accuracy
  parameters:
    loss.dino_text_classification.weight: [0.5, 1.0, 1.5]
    loss.bioclip_image_teacher.weight: [0.0, 0.1, 0.25, 0.5]
    loss.supervised_species.weight: [0.1, 0.25, 0.5, 0.75, 1.0]
  baseline:
    loss.dino_text_classification.weight: 1.0
    loss.bioclip_image_teacher.weight: 0.25
    loss.supervised_species.weight: 0.5
