defaults: [../base.yaml]
evaluation:
  split: train
  candidate_set: unseen
  official_split: unseen
inference:
  unseen:
    candidate_set: unseen
    mode: bioclip_native
model:
  backbone: bioclip2
  bioclip_classifier:
    enabled: false
  bioclip_image_path:
    enabled: true
    mode: frozen_zero_shot
    text_space: native
